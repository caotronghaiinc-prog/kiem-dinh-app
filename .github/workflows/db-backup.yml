name: Database backup

# PROMPT-16b: Supabase free tier không có automatic backup (xem PROGRESS.md).
# Workflow này tự pg_dump database hàng ngày, nén gzip, upload làm artifact.
# Không commit file dump vào git -- chỉ lưu tạm 90 ngày trong Actions artifact.

on:
  schedule:
    # 19:00 UTC = ~2:00 sáng giờ VN (UTC+7)
    - cron: "0 19 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    # Supabase hiện chạy Postgres 17 -- pg_dump của apt-get trên ubuntu-latest
    # là bản 16, và pg_dump từ chối chạy khi client cũ hơn server ("server
    # version mismatch"). Dùng thẳng image postgres:17 chính thức để có
    # pg_dump đúng phiên bản, khỏi cài thêm gì.
    # Nếu sau này Supabase nâng lên major version mới hơn (vd Postgres 18),
    # phải đổi tag image này tương ứng (vd postgres:18), nếu không sẽ lỗi
    # lại y hệt "server version mismatch".
    container: postgres:17
    steps:
      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          FILENAME="backup-$(date +%F).sql"
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -f "$FILENAME"
          gzip "$FILENAME"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.sql.gz
          retention-days: 90
